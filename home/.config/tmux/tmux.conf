# Prefix: Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Terminal / nvim friendliness
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g mouse on
set -g history-limit 50000

# Number windows/panes from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits and new windows open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Move between nvim splits and tmux panes with Ctrl-h/j/k/l (smart-splits.nvim
# sets @pane-is-vim). Ctrl-l is taken, so prefix + Ctrl-l clears the screen.
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"
bind C-l send-keys C-l

# Resize panes with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Project picker / session switcher
bind f display-popup -E -w 60% -h 60% "dev"
bind s choose-tree -Zs

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Status bar: session name plus a WORK/PERSONAL badge
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left-length 40
set -g status-left "#{?#{==:#{@profile},work},#[bg=colour130#,fg=black] WORK ,#{?#{==:#{@profile},personal},#[bg=colour31#,fg=black] PERSONAL ,}}#[default] #S "
set -g status-right "%a %b %d %H:%M "
setw -g window-status-current-style "fg=yellow,bold"
